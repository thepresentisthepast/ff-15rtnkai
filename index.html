<!doctype html>
<html lang="en" data-theme="dark" data-size="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Floor Fix">
<meta name="format-detection" content="telephone=no">
<title>Floor Fix</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="stylesheet" href="lock.css">
</head>
<body class="cc">
<div id="lock-root">
  <header class="lock-bar">
    <span class="lock-mark" aria-hidden="true">FF</span>
    <h1>Floor Fix</h1>
  </header>
  <div class="lock">
    <section class="console-panel" aria-labelledby="lock-title">
      <div class="ptitle" id="lock-title">Unlock // This phone</div>
      <p>Type your passcode. After it unlocks once, this phone can open the app without a network.</p>
      <p class="hint">Enter your PIN.</p>
      <form id="lock-form" action="#" method="post" autocomplete="off">
        <label class="lab" for="pass">Passcode</label>
        <input id="pass" class="field" type="password" name="pass" enterkeyhint="go"
               autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"
               inputmode="numeric" required>
        <button class="btn" id="unlock" type="submit">Unlock</button>
      </form>
      <p class="err" id="lock-err" hidden></p>
      <p class="prog" id="lock-prog" hidden></p>
      <div class="prog-bar" id="lock-bar" hidden><span id="lock-bar-fill"></span></div>
    </section>
  </div>
</div>
<div id="app" hidden>
<header class="top cc-top" id="top">
  <button id="back" class="topbtn" type="button" hidden aria-label="Back">&#8249;</button>
  <a class="brand" href="#/" aria-label="Floor Fix home"><span class="mk" aria-hidden="true">B6</span><h1 id="title">Floor Fix</h1></a>
  <a id="emerg" href="#/contacts" title="911 first. Then the posted call order (links to the posted pages, unchanged).">EMERGENCY</a>
</header>
<div id="console" class="console-strip" aria-live="off"></div>
<div id="banner" class="banner" role="status" hidden></div>
<main id="view" tabindex="-1">
  <p class="loading">Loading the library on this device&hellip;</p>
  <noscript><p class="openline"><b>OPEN.</b> This app needs JavaScript turned on in Safari settings.</p></noscript>
</main>
<nav class="tabs cc-dock" id="tabs" aria-label="Main">
  <a href="#/" data-tab="home"><span class="dki" data-ic="search" data-hc="#22e6ff"></span>Look up</a>
  <a href="#/lanes" data-tab="lanes"><span class="dki" data-ic="lanes" data-hc="#22d3ee"></span>Lanes</a>
  <a href="#/train" data-tab="train"><span class="dki" data-ic="train" data-hc="#ff5ec8"></span>Train</a>
  <a href="#/fix" data-tab="fix"><span class="dki" data-ic="guides" data-hc="#8b6cff"></span>Fix</a>
  <a href="#/map" data-tab="map"><span class="dki" data-ic="sites" data-hc="#39d0ff"></span>Map</a>
  <a href="#/safety" data-tab="safety"><span class="dki" data-ic="siren" data-hc="#ff4d6d"></span>Safety</a>
  <a href="#/more" data-tab="more"><span class="dki" data-ic="about" data-hc="#9fb6d9"></span>More</a>
</nav>
</div>
<script src="lock.js"></script>
</body>
</html>
